name: release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: darwin-amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "octoping") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag must match Cargo.toml version: v$version" >&2
            exit 1
          fi
      - if: startsWith(matrix.platform, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked --target "$TARGET"
      - run: cargo build --locked --release --target "$TARGET"
      - name: Package
        run: |
          archive="octoping-$GITHUB_REF_NAME-$PLATFORM.tar.gz"
          stage="$RUNNER_TEMP/octoping"
          mkdir -p "$stage"
          cp "target/$TARGET/release/octoping" README.md octoping.example.yaml "$stage/"
          COPYFILE_DISABLE=1 tar -C "$stage" -czf "$archive" octoping README.md octoping.example.yaml
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octoping-${{ matrix.platform }}
          path: octoping-*.tar.gz*
          if-no-files-found: error
          compression-level: 0

  docker:
    needs: build
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true

  release:
    needs: [build, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: octoping-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: |
          cat ./*.sha256 | sort -k2 > checksums.txt
          sha256sum --check checksums.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
