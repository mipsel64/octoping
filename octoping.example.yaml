# $VAR / ${VAR} expand from the environment (unset ones stay as is); keep secrets there.
# Scalar values can also be overridden with OCTOPING__<PATH>, e.g. OCTOPING__LISTEN.
listen: 0.0.0.0:8080
secret: ${GITHUB_WEBHOOK_SECRET}
# Seconds between checks of this file for changes; a change here applies after the current wait.
reload_secs: 10

# GitHub login (case-insensitive) -> platform user id, used by mention(login).
users:
  octocat:
    discord: "123456789012345678"

upstreams:
  dev:
    type: discord
    url: ${DISCORD_WEBHOOK_URL}

# Each event fires on deliveries whose X-GitHub-Event header equals `event` and
# whose payload makes the optional `when` MiniJinja expression truthy.
# Templates are MiniJinja, rendered against the raw GitHub payload once per
# upstream, so mention() uses each upstream's format. Empty output skips the message.
# Messages over an upstream's limit (Discord: 2000) are cut with "…"; slice long
# fields like PR bodies (`body[:300]`) to keep the cut away from the important part.
events:
  pr_opened:
    event: pull_request
    when: action == "opened"
    to: [dev]
    template: |
      {% if not pull_request.draft %}
      🆕 {{ mention(sender.login) }} opened [#{{ pull_request.number }} {{ pull_request.title }}](<{{ pull_request.html_url }}>) in `{{ repository.full_name }}`
      {% if pull_request.body %}>>> {{ pull_request.body[:300] }}{% if pull_request.body | length > 300 %}…{% endif %}{% endif %}
      {% endif %}

  pr_approved:
    event: pull_request_review
    when: action == "submitted" and review.state == "approved"
    to: [dev]
    template: |
      ✅ {{ mention(review.user.login) }} approved [#{{ pull_request.number }} {{ pull_request.title }}](<{{ pull_request.html_url }}>) by {{ mention(pull_request.user.login) }}

  pr_merged:
    event: pull_request
    when: action == "closed" and pull_request.merged
    to: [dev]
    template: |
      🔀 {{ mention(pull_request.merged_by.login) }} merged [#{{ pull_request.number }} {{ pull_request.title }}](<{{ pull_request.html_url }}>) into `{{ repository.full_name }}:{{ pull_request.base.ref }}` by {{ mention(pull_request.user.login) }}

  # GitHub lists at most 20 commits per push; force-pushes can have none.
  push_default:
    event: push
    when: not deleted and ref == "refs/heads/" ~ repository.default_branch
    to: [dev]
    template: |
      {% if commits %}
      📦 {{ mention(sender.login) }} pushed to `{{ repository.full_name }}:{{ repository.default_branch }}`
      {% for c in commits[:10] %}- [`{{ c.id[:7] }}`](<{{ c.url }}>) {{ c.message | lines | first }}
      {% endfor %}{% endif %}
