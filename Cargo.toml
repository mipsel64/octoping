[package]
name = "octoping"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
hex = "0.4.3"
hmac = "0.13.0"
minijinja = { version = "2.24.0", features = ["json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
toml = "1.1.6"
