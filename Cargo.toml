[package]
name = "octoping"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
config = { version = "0.15.27", default-features = false, features = ["yaml"] }
hex = "0.4.3"
hmac = "0.13.0"
minijinja = { version = "2.24.0", features = ["json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shellexpand = "3"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
